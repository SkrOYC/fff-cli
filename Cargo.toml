[workspace]
resolver = "2"
members = [
    "crates/ff-cli",
    "crates/ff-daemon",
    "crates/ff-index",
    "crates/ff-watcher",
    "crates/ff-query",
    "crates/ff-ipc",
    "crates/ff-common",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SkrOYC/fff-cli"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.5"
regex = "1.12"
globset = "0.4"
ignore = "0.4"
notify = "8.2"
hashlink = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
proptest = "1.5"
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.13"
criterion = { version = "0.5", features = ["html_reports"] }
toml = "0.8"
notify-debouncer-mini = "0.7"
futures-core = "0.3"
futures-sink = "0.3"
futures-task = "0.3"
